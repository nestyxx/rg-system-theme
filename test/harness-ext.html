<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Banc de test – extension RG System</title>
<style>body{margin:0;font:14px Helvetica,Arial,sans-serif;color:#333}</style>
<script>// Banc de test de l'extension : charge fonts.css + theme.css + content.js comme le ferait le manifest. Ouvrir http://localhost:4173/harness-ext.html (npm run serve). ?off=1 simule le thème désactivé.
if (/off=1/.test(location.search)) localStorage.setItem('rgx.enabled','0'); else localStorage.removeItem('rgx.enabled');
</script>
<link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="theme.css"><script src="content.js"></script>
</head>
<body>
<!-- Mini-DOM imitant la structure de RG System (ids et classes réels) -->
<div id="block-menu-left" class="left-menu background-color-primary">
  <div id="head-menu"><div id="block-menu"><button id="menu-main-burger" class="btn btn-primary">≡</button></div></div>
  <div id="menu-details"><ul class="ul-lvl-0">
    <li id="menu-tickets" class="shortcutMenu menu-lvl-0 current"><a href="#">Tickets</a></li>
    <li id="menu-views" class="menu-lvl-0"><a href="#">Vues</a></li>
  </ul></div>
</div>
<div id="header"><header class="MuiPaper-root MuiAppBar-root"><button class="brain">Brain</button></header></div>
<div id="root"><div id="content"><table class="table table-striped table-hover"><thead><tr><th>Nom</th></tr></thead><tbody><tr><td>Ligne</td></tr></tbody></table></div></div>
</body>
</html>
